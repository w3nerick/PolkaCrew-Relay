services:
  - type: web
    name: polkacrew-relay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: POLKACREW_ALLOWED_ORIGINS
        value: "*"
      - key: POLKACREW_MAX_POSTS_PER_SECOND
        value: "120"
